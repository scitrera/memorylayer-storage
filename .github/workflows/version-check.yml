name: Version Check

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'blobgw-edge/go.mod'
      - 'blobgw-s3/go.mod'
      - 'blobgw/go.mod'
      - 'casstore/go.mod'
      - 'clients/python/pyproject.toml'
      - 'clients/python/src/blobgw_client/__init__.py'
      - 'ctlproto/go.mod'
      - 'go.work'
      - 'manifeststore/go.mod'
      - 'mlfs-csi/go.mod'
      - 'mlfs/go.mod'
      - 'versions.yaml'

permissions:
  contents: read

jobs:
  check:
    name: sync-versions --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Verify versions are in sync
        run: uvx --from 'scitrera-repo-tools==0.1.29' sync-versions --check --verbose

      - name: Verify generated workflows
        run: uvx --from 'scitrera-repo-tools==0.1.29' generate-ci-gha --check
