# Generated by scitrera-repo-tools `generate-ci-gha`. Do not edit by hand;
# re-run the generator after editing versions.yaml. Run
# `generate-ci-gha` (no flags) to check for drift, `generate-ci-gha --force` to apply.

name: Release (ctlproto)
'on':
  push:
    tags:
    - ctlproto/v*.*.*
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  tests:
    uses: ./.github/workflows/test-go.yml
    needs:
    - verify-tag
  verify-tag:
    name: Verify tag matches ctlproto version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
    - name: Verify versions are in sync
      run: uvx --from 'scitrera-repo-tools==0.1.29' sync-versions --check --verbose
    - name: Compare tag against versions.yaml
      if: github.ref_type == 'tag'
      run: |
        set -euo pipefail
        tag="$GITHUB_REF_NAME"
        declared="$(uvx --from 'scitrera-repo-tools==0.1.29' sync-versions --print-version ctlproto)"
        if [ "$tag" != "ctlproto/v$declared" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match the ctlproto version declared in versions.yaml ($declared)"
          exit 1
        fi
        echo "Tag ${GITHUB_REF_NAME} matches versions.yaml ($declared)."
  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs:
    - verify-tag
    - tests
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
