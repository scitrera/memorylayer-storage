# Generated by scitrera-repo-tools `generate-ci-gha`. Do not edit by hand;
# re-run the generator after editing versions.yaml. Run
# `generate-ci-gha` (no flags) to check for drift, `generate-ci-gha --force` to apply.

name: Release (blobgw)
'on':
  push:
    tags:
    - blobgw/v*.*.*
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  tests:
    uses: ./.github/workflows/test-go.yml
    needs:
    - verify-tag
  verify-tag:
    name: Verify tag matches blobgw version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
    - name: Verify versions are in sync
      run: uvx --from 'scitrera-repo-tools==0.1.29' sync-versions --check --verbose
    - name: Compare tag against versions.yaml
      if: github.ref_type == 'tag'
      run: |
        set -euo pipefail
        tag="$GITHUB_REF_NAME"
        declared="$(uvx --from 'scitrera-repo-tools==0.1.29' sync-versions --print-version blobgw)"
        if [ "$tag" != "blobgw/v$declared" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match the blobgw version declared in versions.yaml ($declared)"
          exit 1
        fi
        echo "Tag ${GITHUB_REF_NAME} matches versions.yaml ($declared)."
  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs:
    - verify-tag
    - tests
    - build-blobgw-linux-amd64
    - build-blobgw-linux-arm64
    - merge-blobgw
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
  test-blobgw:
    name: Test blobgw
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: storage
          POSTGRES_PASSWORD: storage
          POSTGRES_DB: storage
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MLFS_TEST_DATABASE_URL: postgres://storage:storage@localhost:5432/storage?sslmode=disable
      BLOBGW_TEST_DATABASE_URL: postgres://storage:storage@localhost:5432/storage?sslmode=disable
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: 1.26.8
        cache-dependency-path: blobgw/go.sum
    - name: Check formatting
      run: |
        test -z "$(gofmt -l .)"
      working-directory: blobgw
    - name: go vet
      run: go vet ./...
      working-directory: blobgw
    - name: go test
      run: go test -race -count=1 -timeout=10m ./...
      working-directory: blobgw
    needs:
    - verify-tag
  build-blobgw-linux-amd64:
    name: Build blobgw (linux/amd64)
    runs-on: ubuntu-latest
    needs:
    - verify-tag
    - test-blobgw
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
    - name: Read image version from versions.yaml
      id: imgver
      run: |
        VER=$(uvx --from 'scitrera-repo-tools==0.1.29' sync-versions --print-version blobgw)
        echo "version=$VER" >> "$GITHUB_OUTPUT"
        echo "major_minor=$(echo $VER | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ghcr.io/scitrera/blobgw
        tags: |
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=${{ steps.imgver.outputs.version }},enable=${{ steps.imgver.outputs.version != '' }}
          type=raw,value=${{ steps.imgver.outputs.major_minor }},enable=${{ steps.imgver.outputs.major_minor != '' }}
    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile.blobgw
        platforms: linux/amd64
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,name=ghcr.io/scitrera/blobgw,push-by-digest=true,name-canonical=true,push=true
        build-args: |
          VERSION=${{ steps.imgver.outputs.version }}
        cache-from: type=gha,scope=blobgw-linux-amd64
        cache-to: type=gha,mode=max,scope=blobgw-linux-amd64
  build-blobgw-linux-arm64:
    name: Build blobgw (linux/arm64)
    runs-on: ubuntu-24.04-arm
    needs:
    - verify-tag
    - test-blobgw
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
    - name: Read image version from versions.yaml
      id: imgver
      run: |
        VER=$(uvx --from 'scitrera-repo-tools==0.1.29' sync-versions --print-version blobgw)
        echo "version=$VER" >> "$GITHUB_OUTPUT"
        echo "major_minor=$(echo $VER | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ghcr.io/scitrera/blobgw
        tags: |
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=${{ steps.imgver.outputs.version }},enable=${{ steps.imgver.outputs.version != '' }}
          type=raw,value=${{ steps.imgver.outputs.major_minor }},enable=${{ steps.imgver.outputs.major_minor != '' }}
    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile.blobgw
        platforms: linux/arm64
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,name=ghcr.io/scitrera/blobgw,push-by-digest=true,name-canonical=true,push=true
        build-args: |
          VERSION=${{ steps.imgver.outputs.version }}
        cache-from: type=gha,scope=blobgw-linux-arm64
        cache-to: type=gha,mode=max,scope=blobgw-linux-arm64
  merge-blobgw:
    name: Merge blobgw multi-arch manifest
    runs-on: ubuntu-latest
    needs:
    - verify-tag
    - build-blobgw-linux-amd64
    - build-blobgw-linux-arm64
    permissions:
      contents: read
      packages: write
    outputs:
      base-tag: ${{ steps.meta.outputs.version }}
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
    - name: Read image version from versions.yaml
      id: imgver
      run: |
        VER=$(uvx --from 'scitrera-repo-tools==0.1.29' sync-versions --print-version blobgw)
        echo "version=$VER" >> "$GITHUB_OUTPUT"
        echo "major_minor=$(echo $VER | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ghcr.io/scitrera/blobgw
        tags: |
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=${{ steps.imgver.outputs.version }},enable=${{ steps.imgver.outputs.version != '' }}
          type=raw,value=${{ steps.imgver.outputs.major_minor }},enable=${{ steps.imgver.outputs.major_minor != '' }}
    - name: Create multi-arch manifest
      env:
        DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
      run: |
        TAGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
        eval "docker buildx imagetools create $TAGS \
          ghcr.io/scitrera/blobgw@${{ needs.build-blobgw-linux-amd64.outputs.digest }} \
          ghcr.io/scitrera/blobgw@${{ needs.build-blobgw-linux-arm64.outputs.digest }}"
