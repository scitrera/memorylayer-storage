# Generated by scitrera-repo-tools `generate-ci-gha`. Do not edit by hand;
# re-run the generator after editing versions.yaml. Run
# `generate-ci-gha` (no flags) to check for drift, `generate-ci-gha --force` to apply.

name: Test (Go)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

concurrency:
  # github.ref is stable across pushes to the same PR (refs/pull/N/merge), so
  # this still cancels a superseded run when you push again — the case where
  # cancelling is the right outcome. It deliberately does NOT collapse the
  # push and pull_request runs of one commit: that duplicate is avoided with
  # ci.push_branches instead, because a cancelled run reports as cancelled
  # rather than as success.
  group: test-go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-blobgw:
    name: Test blobgw
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: storage
          POSTGRES_PASSWORD: storage
          POSTGRES_DB: storage
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries
          10
    env:
      MLFS_TEST_DATABASE_URL: postgres://storage:storage@localhost:5432/storage?sslmode=disable
      BLOBGW_TEST_DATABASE_URL: postgres://storage:storage@localhost:5432/storage?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache-dependency-path: blobgw/go.sum

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"
        working-directory: blobgw


      - name: go vet
        run: go vet ./...
        working-directory: blobgw

      - name: go test
        run: go test -race -count=1 -timeout=10m ./...
        working-directory: blobgw
  security-blobgw:
    name: govulncheck blobgw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache-dependency-path: blobgw/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Run govulncheck
        working-directory: blobgw
        env:
          IGNORED_ADVISORIES: ""
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/govulncheck-blobgw.json"
          # Exit status is non-zero when anything is found; the JSON is what we
          # judge on, so do not let `set -e` stop us before reading it.
          govulncheck -format json ./... > "$report"
          status=$?
          if [ ! -s "$report" ]; then
            echo "::error::govulncheck produced no output (exit $status)"
            exit 1
          fi

          # A finding with a function in its trace is reachable from this module.
          called=$(jq -r 'select(has("finding")) | .finding
                          | select((.trace[0].function? // null) != null) | .osv'                      "$report" | sort -u)

          fail=0
          for vuln in $called; do
            if printf '%s\n' $IGNORED_ADVISORIES | grep -qx "$vuln"; then
              echo "::notice::$vuln reachable but allow-listed (see ci.go.govulncheck_ignore)"
            else
              echo "::error::$vuln is reachable and not allow-listed — see https://pkg.go.dev/vuln/$vuln"
              fail=1
            fi
          done

          # An allow-list entry that no longer matches anything is stale: the
          # dependency was fixed or dropped, and the waiver should go with it.
          for vuln in $IGNORED_ADVISORIES; do
            if ! printf '%s\n' $called | grep -qx "$vuln"; then
              echo "::warning::$vuln is allow-listed but no longer reachable; drop it from ci.go.govulncheck_ignore"
            fi
          done

          [ "$fail" = 0 ]
